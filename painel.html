<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="robots" content="noindex">
<title>Painel do facilitador • Trilha de Carreira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=2">
<style>
  .pagina.larga { max-width: 960px; }
  .grade { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .numeros { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .numeros .cartao { padding: 14px 16px; }
  .numeros .valor { font-family: 'Domine', Georgia, serif; font-size: 2rem; font-weight: 700; line-height: 1.1; }
  .numeros .rot { font-size: .82rem; font-weight: 700; color: var(--suave); }
  .barras { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .barra { display: grid; grid-template-columns: 112px 1fr 36px; align-items: center; gap: 10px; font-size: .92rem; }
  .barra .nome { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra .trilho { height: 22px; background: var(--creme); border-radius: 0 4px 4px 0; }
  .barra .cheio { height: 100%; background: var(--laranja); border-radius: 0 4px 4px 0; min-width: 2px; transition: width .3s; }
  .barra .n { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 4px; text-align: center; }
  th { font-size: .78rem; color: var(--suave); font-weight: 800; }
  td.cel { border: 2px solid var(--branco); border-radius: 4px; font-weight: 700; }
  td.diag { outline: 2px solid var(--azul); outline-offset: -2px; }
  .lista { list-style: none; padding: 0; margin: 10px 0 0; }
  .lista li { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--linha); }
  .lista li:first-child { border-top: 0; }
  .lista b { font-variant-numeric: tabular-nums; }
  .acoes { display: flex; flex-wrap: wrap; gap: 10px; }
  .acoes .botao { width: auto; flex: 1 1 220px; }
  .cabeca { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="pagina larga">
  <div class="marca">Legado UERJ • Trilha de Carreira</div>
  <main id="app" class="tela"></main>
</div>
<script src="config.js?v=2"></script>
<script src="comum.js?v=2"></script>
<script>
(function () {
  'use strict';
  var P = window.PDP, esc = P.esc, app = document.getElementById('app');
  var senha = null, dados = null, timer = null;
  try { senha = sessionStorage.getItem('pdp_painel'); } catch (e) {}

  function entrar(msg) {
    app.innerHTML = '<div style="max-width:420px" class="pilha">' +
      '<h1>Painel do facilitador</h1>' +
      '<form id="f" class="pilha" style="gap:12px"><div class="campo"><label for="s">Senha</label>' +
      '<input id="s" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"></div>' +
      (msg ? '<p class="erro">' + esc(msg) + '</p>' : '') +
      '<button class="botao" type="submit">Entrar</button></form></div>';
    document.getElementById('f').onsubmit = function (ev) {
      ev.preventDefault(); senha = document.getElementById('s').value.trim(); carregar(true);
    };
    document.getElementById('s').focus();
  }

  function carregar(primeira) {
    clearTimeout(timer);
    P.rpc('pdp_painel', { p_senha: senha }).then(function (d) {
      try { sessionStorage.setItem('pdp_painel', senha); } catch (e) {}
      dados = d; desenhar();
      timer = setTimeout(carregar, 15000);
    }, function (err) {
      if (err && !err.rede) { try { sessionStorage.removeItem('pdp_painel'); } catch (e) {} senha = null; entrar('Senha incorreta.'); return; }
      if (primeira && !dados) entrar('Sem conexão. Tente de novo.');
      else { var s = document.getElementById('hora'); if (s) s.textContent = 'sem conexão, tentando de novo…'; timer = setTimeout(carregar, 15000); }
    });
  }

  function desenhar() {
    var d = dados, total = d.total || 0;
    var maxEtapa = Math.max.apply(null, [1].concat([1, 2, 3, 4, 5].map(function (k) { return d.por_etapa[k] || 0; })));

    // diferença percebida × calculada
    var igual = 0, acima = 0, abaixo = 0;
    d.linhas.forEach(function (l) { if (l.diferenca === 0) igual++; else if (l.diferenca > 0) acima++; else abaixo++; });

    // matriz: linhas = percebida, colunas = calculada
    var m = {}, maxCel = 1;
    d.matriz.forEach(function (c) { m[c.p + '-' + c.c] = c.n; if (c.n > maxCel) maxCel = c.n; });

    var desc = d.descreve || {};
    var semanas = d.registros_semana || [];

    var h = '<div class="cabeca"><h1>Painel do facilitador</h1>' +
      '<p class="pequeno suave">Atualiza a cada 15 s · <span id="hora">' + new Date(d.agora).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + '</span></p></div>';

    h += '<div class="numeros">' +
      num(total, 'pontos de partida') +
      num(pct(igual, total), 'se veem na etapa calculada') +
      num(d.linhas.filter(function (l) { return l.te_descreve; }).length, 'responderam “te descreve?”') +
      num(d.linhas.filter(function (l) { return l.registros_feitos > 0; }).length, 'fizeram registro da semana') +
      num(d.apostas, 'preencheram o Meu teste') +
      '</div>';

    h += '<div class="grade">';

    // distribuição por etapa
    h += '<div class="cartao"><h2>Pessoas por etapa calculada</h2><div class="barras">' +
      [1, 2, 3, 4, 5].map(function (k) {
        var n = d.por_etapa[k] || 0;
        var extra = k === 5 && d.consolidadas ? ' (' + d.consolidadas + ' consolidada' + (d.consolidadas > 1 ? 's' : '') + ')' : '';
        return '<div class="barra" title="Etapa ' + k + ': ' + n + ' pessoa' + (n === 1 ? '' : 's') + extra + '">' +
          '<span class="nome">' + k + ' · ' + esc(P.ETAPAS[k].nome) + '</span>' +
          '<span class="trilho"><span class="cheio" style="display:block;width:' + (n / maxEtapa * 100) + '%"></span></span>' +
          '<span class="n">' + n + '</span></div>';
      }).join('') + '</div>' +
      (d.consolidadas ? '<p class="pequeno suave" style="margin-top:10px">Na etapa 5, ' + d.consolidadas + ' com as seis respostas “sim” (consolidada).</p>' : '') +
      '</div>';

    // percebida × calculada
    h += '<div class="cartao"><h2>Percebida × calculada</h2>' +
      '<ul class="lista"><li><span>Mesma etapa</span><b>' + igual + '</b></li>' +
      '<li><span>Se veem numa etapa à frente</span><b>' + acima + '</b></li>' +
      '<li><span>Se veem numa etapa anterior</span><b>' + abaixo + '</b></li></ul>' +
      '<table style="margin-top:14px" aria-label="Contagem por etapa percebida (linhas) e calculada (colunas)">' +
      '<tr><th style="text-align:left">percebida ↓ · calculada →</th>' + [1, 2, 3, 4, 5].map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>' +
      [1, 2, 3, 4, 5].map(function (p) {
        return '<tr><th style="text-align:left">' + p + '</th>' + [1, 2, 3, 4, 5].map(function (c) {
          var n = m[p + '-' + c] || 0, a = n ? 0.15 + 0.75 * (n / maxCel) : 0;
          var fundo = n ? 'rgba(242,140,40,' + a.toFixed(2) + ')' : 'var(--creme)';
          return '<td class="cel' + (p === c ? ' diag' : '') + '" style="background:' + fundo + '" title="Percebida ' + p + ', calculada ' + c + ': ' + n + '">' + (n || '') + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</table>' +
      '<p class="pequeno suave" style="margin-top:8px">Diagonal contornada = mesma etapa.</p></div>';

    // te descreve?
    h += '<div class="cartao"><h2>“Essa etapa te descreve?”</h2><ul class="lista">' +
      [['sim', 'Sim'], ['mais_ou_menos', 'Mais ou menos'], ['nao', 'Não'], ['sem_resposta', 'Sem resposta']].map(function (o) {
        return '<li><span>' + o[1] + '</span><b>' + (desc[o[0]] || 0) + '</b></li>';
      }).join('') + '</ul></div>';

    // registro da semana
    h += '<div class="cartao"><h2>Registro da semana</h2>' +
      (semanas.length ? '<ul class="lista">' + semanas.map(function (s) {
        return '<li><span>Semana de ' + new Date(s.semana + 'T12:00:00').toLocaleDateString('pt-BR') + '</span><b>' + s.pessoas + ' pessoa' + (s.pessoas === 1 ? '' : 's') + '</b></li>';
      }).join('') + '</ul>' : '<p class="suave" style="margin-top:10px">Nenhum registro ainda.</p>') + '</div>';

    h += '</div>';

    h += '<div class="cartao pilha"><h2>Exportar CSV</h2><div class="acoes">' +
      '<button class="botao" id="csv1">Pontos de partida (' + d.linhas.length + ')</button>' +
      '<button class="botao claro" id="csv2">Registros da semana (' + d.linhas_registros.length + ')</button>' +
      '<button class="botao claro" id="csv3">Meu teste (' + d.linhas_apostas.length + ')</button></div>' +
      '<p class="pequeno suave">Separador ponto e vírgula, abre direto no Excel em português e no Google Planilhas.</p></div>' +
      '<p class="rodape"><button class="botao texto" id="sair">Sair</button></p>';

    app.innerHTML = h;
    document.getElementById('csv1').onclick = function () { baixar('pontos-de-partida', d.linhas, COLUNAS_PDP); };
    document.getElementById('csv2').onclick = function () { baixar('registros-da-semana', d.linhas_registros, ['nome', 'email', 'encontro', 'energia', 'surpresa', 'criterio', 'pergunta', 'criado_em']); };
    document.getElementById('csv3').onclick = function () { baixar('meu-teste', d.linhas_apostas, ['nome', 'email', 'etapa_calculada', 'aposta', 'teste', 'sigo_se', 'paro_se', 'ate', 'com_quem', 'criado_em', 'atualizado_em']); };
    document.getElementById('sair').onclick = function () { try { sessionStorage.removeItem('pdp_painel'); } catch (e) {} clearTimeout(timer); senha = null; dados = null; entrar(); };
  }

  function num(v, rot) { return '<div class="cartao"><div class="valor">' + v + '</div><div class="rot">' + rot + '</div></div>'; }
  function pct(n, t) { return t ? Math.round(n / t * 100) + '%' : '–'; }

  var COLUNAS_PDP = ['nome', 'email', 'curso', 'periodo', 'momento', 'q1', 'q2', 'q3', 'q4', 'q5', 'q6', 'q7',
    'etapa_calculada', 'etapa_percebida', 'diferenca', 'consolidada', 'te_descreve', 'registros_feitos', 'fez_meu_teste', 'criado_em'];

  function celula(v) {
    if (v === true) v = 'sim'; else if (v === false) v = 'não'; else if (v == null) v = '';
    if (v === 'mais_ou_menos') v = 'mais ou menos'; else if (v === 'nao') v = 'não';
    if (typeof v === 'string' && /^\d{4}-\d\d-\d\dT/.test(v)) v = new Date(v).toLocaleString('pt-BR');
    v = String(v);
    return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  function baixar(nome, linhas, colunas) {
    var csv = '﻿' + colunas.join(';') + '\r\n' +
      linhas.map(function (l) { return colunas.map(function (c) { return celula(l[c]); }).join(';'); }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = nome + '-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  if (senha) carregar(true); else entrar();
})();
</script>
</body>
</html>
